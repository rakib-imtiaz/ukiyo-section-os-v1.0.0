<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ThemeBot</title>
<style>
  :root { --bg: #f4f6fb; --ink: #0f1b3d; --muted: #6b7690; --accent: #2f6bff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1220; --ink: #e8ecf6; --muted: #8b95ad; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(140deg, #4d82ff, var(--accent)); display: grid; place-items: center; }
  .logo .mark { width: 58%; height: 58%; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--muted); max-width: 420px; }
  .bar { width: 160px; height: 4px; border-radius: 2px; background: rgba(127,127,127,.2); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .error .bar { display: none; }
  .error p { color: #c2410c; white-space: pre-wrap; }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="logo"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" fill="#fff"/><path d="M20 3v4M22 5h-4M4 17v2M5 18H3" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg></div>
    <h1>ThemeBot</h1>
    <p id="msg">Starting…</p>
    <div class="bar"><i></i></div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('error')) { document.getElementById('box').classList.add('error'); document.getElementById('msg').textContent = params.get('error'); }
</script>
</body>
</html>
