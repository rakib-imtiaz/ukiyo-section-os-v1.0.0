# Builds the ThemeBot desktop installers on each OS (an installer can only be built on its own OS).
# Produces downloadable workflow artifacts only — nothing is published or released from here.
#
# ThemeBot Cloud: set the repository VARIABLES (Settings → Secrets and variables → Actions →
# Variables; not secrets, both values are public) THEMEBOT_CLOUD_URL (https://<your cloud domain>)
# and THEMEBOT_CLOUD_PUBKEY (from https://<your cloud domain>/v1/public-key) to build installers that
# sign in to that Cloud. Unset = installers that need no account (as before). See deploy/README.md.
name: Desktop installers

# Runs only when started by hand (Actions → Desktop installers → Run workflow): on a private repo
# every run spends Actions minutes, and the macOS runners count 10× against the free allowance.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # ThemeBot-Setup-<v>-x64.exe
          - os: macos-latest     # Apple Silicon .dmg/.zip
          - os: macos-13         # Intel .dmg/.zip
          - os: ubuntu-22.04     # .AppImage + .deb
    runs-on: ${{ matrix.os }}
    env:
      THEMEBOT_EDITION: customer
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned until the signing certificates exist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (node-pty is compiled here on Linux)
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build installer
        # Only this step sees the Cloud address, so the tests above run exactly as before. An unset
        # variable arrives as an empty string, which scripts/desktop/build.mjs treats as "no Cloud".
        env:
          THEMEBOT_CLOUD_URL: ${{ vars.THEMEBOT_CLOUD_URL }}
          THEMEBOT_CLOUD_PUBKEY: ${{ vars.THEMEBOT_CLOUD_PUBKEY }}
        shell: bash
        run: |
          if [ -n "$THEMEBOT_CLOUD_URL" ]; then echo "Cloud build: sign-in to $THEMEBOT_CLOUD_URL"; else echo "No Cloud: installers need no account"; fi
          npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: themebot-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
