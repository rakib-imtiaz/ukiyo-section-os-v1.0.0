# ThemeBot desktop installers. Run `npm run desktop:pack` on each OS (or let CI do it):
# Windows → NSIS .exe, macOS → .dmg + .zip, Linux → AppImage + .deb.
# Inputs come from scripts/desktop/build.mjs. Nothing is published from here (--publish never).
appId: com.themebot.desktop
productName: ThemeBot
copyright: Copyright © 2026 ThemeBot
electronVersion: 44.5.1

directories:
  app: build/desktop-app       # bundled main + preload — becomes app.asar
  output: release
  buildResources: desktop/assets

# The app folder is self-contained (main + preload are bundled): never pull in the repo's
# node_modules, and nothing to rebuild for Electron.
files:
  - "**/*"
  - "!**/node_modules/**"
npmRebuild: false
nodeGypRebuild: false

# Everything the server needs, next to app.asar (resources/). Real files, not inside the asar:
# the server, QA scripts and templates are read and executed by the bundled Node runtime.
# node_modules is listed on its own because electron-builder skips it inside a broader copy.
extraResources:
  - from: build/resources
    to: .
    filter: ["**/*", "!node_modules/**"]
  - from: build/resources/node_modules
    to: node_modules
    filter: ["**/*"]
  - from: build/runtime/${platform}-${arch}
    to: runtime
    filter: ["**/*"]
  # npm itself lives in the runtime's node_modules (Windows) or lib/node_modules (macOS/Linux),
  # which the copy above silently drops — list them explicitly or `npm` is broken in the app.
  - from: build/runtime/${platform}-${arch}/node_modules
    to: runtime/node_modules
    filter: ["**/*"]
  - from: build/runtime/${platform}-${arch}/lib/node_modules
    to: runtime/lib/node_modules
    filter: ["**/*"]

asar: true
compression: normal

# Electron fuses, flipped in the packaged binary (pack.mjs reads them back and fails the build if
# they didn't take). Speed bumps against tampering, not DRM:
# - runAsNode off: ThemeBot.exe can't be used as a plain Node.js (ELECTRON_RUN_AS_NODE). Safe: the
#   server runs on its own bundled Node (resources/runtime), never on the Electron binary.
# - NODE_OPTIONS / --inspect off: no injecting code or attaching a debugger to the main process.
#   Chromium's --remote-debugging-port (renderer DevTools, our QA tooling) is not affected.
# - app.asar only, and its header hash is embedded in the executable and checked at start
#   (Windows: Electron ≥ 30). Editing app.asar stops the app. The server, templates and runtime
#   are extraResources outside the asar and are not covered by this check.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Re-applies the ad-hoc signature on unsigned Apple Silicon builds (flipping fuses breaks it).
  resetAdHocDarwinSignature: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ThemeBot-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ThemeBot

mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  artifactName: ThemeBot-${version}-${arch}.${ext}
  extendInfo:
    NSDesktopFolderUsageDescription: ThemeBot reads website projects and saves theme builds in folders you choose.
    NSDocumentsFolderUsageDescription: ThemeBot reads website projects and saves theme builds in folders you choose.
    NSDownloadsFolderUsageDescription: ThemeBot reads website projects and saves theme builds in folders you choose.

linux:
  target: [AppImage, deb]
  category: Development
  maintainer: ThemeBot
  artifactName: ThemeBot-${version}-${arch}.${ext}
