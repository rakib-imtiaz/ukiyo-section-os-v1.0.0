services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sectionos
      POSTGRES_PASSWORD: sectionos
      POSTGRES_DB: sectionos
    ports:
      - "5432:5432"
    volumes:
      - sectionos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sectionos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sectionos_postgres:
